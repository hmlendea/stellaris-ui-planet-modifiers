name: Steam Workshop

on:
  push:
    tags:
    - 'v*.*.*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build the release archive
      run: |
        zip -r "release.zip" "ui-planet-modifiers/" "ui-planet-modifiers.mod"

    - name: Extract the release archive
      run: |
        unzip "release.zip" -d "release/"

    - name: Upload
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 281990
        itemid: 2072966604
        path: "release/ui-planet-modifiers/"
        changenote: "[url=https://github.com/hmlendea/stellaris-ui-planet-modifiers/releases/tag/${{github.ref_name}}]Version ${{github.ref_name}}[/url]"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}