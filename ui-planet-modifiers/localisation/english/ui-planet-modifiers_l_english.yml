l_english:
 ui_dense_atmosphere_desc:0 "This world is blanketed in a heavy, crushing atmosphere that makes its surface difficult to build on."
 ui_dense_atmosphere:0 "Dense Atmosphere"
 ui_extreme_temperatures_desc:0 "This planet has almost no atmosphere to buffer it, so the surface swings between blistering heat in the light and freezing cold in the dark."
 ui_extreme_temperatures:0 "Extreme Temperatures"
 ui_geological_instability_desc:0 "This world's crust is restless, with frequent tremors and shifting ground that make large-scale construction on its surface hazardous."
 ui_geological_instability:0 "Geological Instability"
 ui_no_magnetic_field_desc:0 "This world has no magnetic field, leaving its surface and its settlers completely exposed to cosmic radiation."
 ui_no_magnetic_field:0 "No Magnetic Field"
 ui_radioactive_desc:0 "Trace radioactive isotopes in this world's crust sicken its settlers and distort organic research."
 ui_radioactive:0 "Radioactive"
 ui_salty_desc:0 "This world has extremely salty soils and waters, making it very hard for anything to grow on it."
 ui_salty:0 "Salty"
 ui_superdense_core_desc:0 "Beneath this world's surface lies a core of extraordinary density, its mineral wealth allowing for more extensive development than its crust would otherwise support."
 ui_superdense_core:0 "Superdense Core"
 ui_swampy_desc:0 "This world is littered with dense swamps, rendering large portions of it dangerous and unworkable."
 ui_swampy:0 "Swampy"
 ui_thin_atmosphere_desc:0 "This world has only a whisper of an atmosphere, too little to buffer its surface or hold on to the heat it receives."
 ui_thin_atmosphere:0 "Thin Atmosphere"
 ui_toxic_soil_desc:0 "This world's soils are laced with toxic compounds, poisoning the ground and leaving it barren of anything worth growing."
 ui_toxic_soil:0 "Toxic Soil"
